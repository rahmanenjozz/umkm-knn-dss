[project]
name = "umkm-knn-dss"
version = "0.1.0"
description = "Decision Support System for UMKM"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.1.3",
    "pandas>=2.3.3",
]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "scikit-learn",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/umkm_knn"]
