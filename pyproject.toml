[project]
name = "umkm-knn-dss"
version = "0.1.0"
description = "Decision Support System for UMKM"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.3.3",
    "streamlit>=1.67",
]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "scikit-learn",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/umkm_knn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]


[tool.ruff.lint.isort]
known-first-party = ["umkm_knn", "generate_sintetis"]
